<title>FMみなせ 78.6MHz｜みなせのまちのラジオ局</title>
<meta name="description" content="FMみなせ（78.6MHz）は、みなせ市のコミュニティFM局です。番組表、パーソナリティ、聴き逃し配信、お便りのご案内。">

<style>
:root{--main:#0f5f6b;--main2:#13808f;--sky:#eef6f6;--ink:#23292b;--muted:#6c787b;--line:#dbe6e7;--bg:#fff;--card:#fff;--accent:#ef7b3e;--foot:#0c3940}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-size:15px;line-height:1.9;letter-spacing:.04em;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.en{font-family:"Jost",sans-serif;letter-spacing:.12em;font-weight:500}
.inner{max-width:1060px;margin:0 auto;padding:0 20px}
.util{background:var(--foot);color:#cfe5e7;font-size:11.5px}
.util .inner{display:flex;justify-content:space-between;align-items:center;height:32px;gap:10px}
.util .tick{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onair{display:inline-flex;align-items:center;gap:6px}.onair::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
header.gh{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gh .inner{display:flex;align-items:center;height:66px;gap:18px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo b{font-family:"Jost";font-size:24px;font-weight:600;letter-spacing:.02em;color:var(--main)}
.logo span{font-size:10.5px;color:var(--muted);line-height:1.3}
.gnav{display:flex;gap:20px;margin-left:auto;font-size:13.5px;font-weight:500}
.gnav a{padding:21px 0;border-bottom:2px solid transparent}
.gnav a.on,.gnav a:hover{border-color:var(--main2);color:var(--main2)}
.listen{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:20px;white-space:nowrap}
.hamb{display:none;margin-left:auto;background:none;border:none;width:40px;height:40px;cursor:pointer}
.hamb span{display:block;height:2px;background:var(--ink);margin:6px 8px}
.drawer{display:none;background:var(--card);border-bottom:1px solid var(--line)}
.drawer.open{display:block}
.drawer a{display:block;padding:13px 20px;border-top:1px solid var(--line);font-size:14px}
@media(max-width:900px){.gnav,.gh .listen{display:none}.hamb{display:block}}
main{min-height:60vh}
section{padding:52px 0}
section.alt{background:var(--sky)}
.sh{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.sh .en{font-size:28px;color:var(--main);line-height:1}
.sh h2{font-size:14px;font-weight:500;color:var(--muted)}
.sh .more{margin-left:auto;font-size:13px;color:var(--main2);border-bottom:1px solid currentColor}
.pagehead{background:var(--main);color:#fff;padding:40px 0 32px}
.pagehead .en{font-size:12px;color:#a6dbe0}
.pagehead h1{font-size:25px;font-weight:500;letter-spacing:.1em}
.crumb{font-size:12px;color:var(--muted);padding:12px 0}
.crumb a{color:var(--main2)}
.lead{font-size:14.5px;margin-bottom:20px}
.note{font-size:12.5px;color:var(--muted)}
.ph{background:linear-gradient(160deg,#6aa6ad,#0f3b42);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero{position:relative;height:min(64vh,460px);overflow:hidden;color:#fff}
.hero .ph{position:absolute;inset:0}
.hero .cover{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,40,46,.75),rgba(6,40,46,.1))}
.hero .copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
.hero .freq{font-family:"Jost";font-size:clamp(46px,9vw,84px);font-weight:500;line-height:1}
.hero .freq small{font-size:.35em;margin-left:6px}
.hero p{font-size:15px;margin-top:10px;letter-spacing:.1em}
.nowcard{background:var(--card);border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 20px;margin-top:-34px;position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.nowcard .tm{font-family:"Jost";font-size:22px;color:var(--main)}
.nowcard b{font-size:16px}
@media(max-width:640px){.nowcard{grid-template-columns:1fr}}
.btn{display:inline-block;border:1px solid var(--main);color:var(--main);padding:9px 22px;font-size:13.5px;border-radius:20px;background:none;cursor:pointer;font-family:inherit}
.btn.fill{background:var(--accent);border-color:var(--accent);color:#fff}
.news{border-top:1px solid var(--line)}
.news li{list-style:none;border-bottom:1px solid var(--line);padding:14px 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14.5px}
.news time{font-family:"Jost";font-size:13px;color:var(--muted)}
@media(max-width:640px){.news li{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card .ph{aspect-ratio:4/3}
.card .meta{font-size:12px;color:var(--muted);margin-top:10px}
.card h3{font-size:16px;font-weight:700;margin:2px 0 4px}
.card p{font-size:13.5px;color:var(--muted);line-height:1.8}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th,.tt td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left;font-weight:400;vertical-align:top}
.tt th{font-family:"Jost";color:var(--main);width:120px;font-size:15px}
.tt small{color:var(--muted)}
.dtable{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px}
.dtable th,.dtable td{border:1px solid var(--line);padding:10px 12px;text-align:left;font-weight:400;vertical-align:top}
.dtable th{background:var(--sky);width:32%;font-weight:500}
h3.sub{font-size:17px;font-weight:700;border-left:4px solid var(--main2);padding-left:12px;margin:30px 0 14px}
.prof{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.pcard{border:1px solid var(--line);padding:20px;background:var(--card)}
.pcard .av{width:64px;height:64px;border-radius:50%;background:var(--sky);display:flex;align-items:center;justify-content:center;font-family:"Jost";font-size:22px;color:var(--main2);margin-bottom:10px}
.pcard h3{font-size:17px}
.pcard dl{font-size:13px;margin-top:8px}.pcard dt{color:var(--muted);font-size:11.5px;margin-top:6px}
.ep{border:1px solid var(--line);padding:16px;margin-bottom:14px;background:var(--card)}
.ep h4{font-size:15px}.ep .d{font-size:12px;color:var(--muted)}
.ep .tr{font-size:13.5px;margin-top:10px;max-height:0;overflow:hidden;transition:max-height .4s}
.ep.open .tr{max-height:1200px}
.ep .tr p{margin:4px 0}.ep .tr .nzl{color:var(--muted);letter-spacing:.08em}
.ep .tr p.now{background:#fff6e8}
.form{display:grid;gap:12px;max-width:560px}
.form label{font-size:13px;color:var(--main);display:block;margin-bottom:4px}
.form input,.form textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.q{font-weight:700;margin-top:22px;padding-left:1.8em;text-indent:-1.8em}.q::before{content:"Q.";font-family:"Jost";color:var(--main2);margin-right:.6em}
.a{font-size:14px;padding:8px 0 18px 1.8em;text-indent:-1.8em;border-bottom:1px solid var(--line)}.a::before{content:"A.";font-family:"Jost";color:var(--accent);margin-right:.6em}
details.h2{margin-top:6px;font-size:13px}details.h2 summary{cursor:pointer;color:var(--main2)}
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.bn{border:1px solid var(--line);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:2px}
.bn b{font-size:14px}.bn small{font-size:12px;color:var(--muted)}.bn .en{font-size:10.5px;color:var(--main2)}
footer{background:var(--foot);color:#c5dcde;font-size:13px;padding:46px 0 22px}
.fcols{display:grid;grid-template-columns:1.4fr repeat(2,1fr);gap:24px}
.fcols h4{font-family:"Jost";font-size:12px;color:#fff;font-weight:500;margin-bottom:10px;letter-spacing:.14em}
.fcols a{display:block;line-height:2.3;opacity:.85}
.fbottom{border-top:1px solid rgba(255,255,255,.15);margin-top:30px;padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;opacity:.75}
.fbottom button{background:none;border:none;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:760px){.fcols{grid-template-columns:1fr 1fr}.fcols>div:first-child{grid-column:1/-1}}
/* ===== ウェブラジオ ===== */
.radio{max-width:520px;margin:0 auto;background:#2b2621;border-radius:16px;padding:22px;color:#e9dfcf;box-shadow:0 10px 30px rgba(0,0,0,.25);user-select:none;-webkit-user-select:none;touch-action:none}
.radio .disp{--nz:0;position:relative;overflow:hidden;background:#0d1a14;border-radius:6px;padding:14px;text-align:center;font-family:"Jost";color:#9fe3b4;text-shadow:0 0 8px rgba(110,230,150,.5)}
.radio .disp::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:calc(var(--nz)*2.4);background:repeating-linear-gradient(0deg,rgba(200,255,220,.18) 0 1px,transparent 1px 3px);animation:nz .12s steps(2) infinite}
@keyframes nz{50%{transform:translateY(2px)}}
.radio .disp b{font-size:44px;font-weight:500;letter-spacing:.04em}.radio .disp small{font-size:14px;margin-left:6px}
.radio .st{font-size:12.5px;font-family:"Noto Sans JP";min-height:20px;color:#bfe9c9}
.scale{position:relative;height:38px;margin:14px 0 6px;background:#efe3c8;border-radius:4px;overflow:hidden}
.scale .tk{position:absolute;bottom:0;width:1px;background:#6b5a40}
.scale .lb{position:absolute;top:2px;font-family:"Jost";font-size:10px;color:#6b5a40;transform:translateX(-50%)}
.scale .needle{position:absolute;top:0;bottom:0;width:2px;background:#d0402a;transition:left .15s}
.knob{width:120px;height:120px;border-radius:50%;margin:14px auto 4px;background:radial-gradient(circle at 40% 35%,#6b5e50,#2a231c);border:4px solid #1a1510;position:relative;cursor:grab}
.knob::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:24px;margin-left:-2px;background:#e9dfcf;border-radius:2px}
.radio .hint{text-align:center;font-size:12px;color:#a89a84}
.radio .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.radio button{font:inherit;font-size:13px;background:#3f372f;color:#e9dfcf;border:1px solid #5a4e42;padding:8px 14px;border-radius:6px;cursor:pointer}
.radio button:disabled{opacity:.35}
.radio.shakeit{animation:rshake .25s}
@keyframes rshake{25%{transform:translateX(-6px) rotate(-1deg)}75%{transform:translateX(6px) rotate(1deg)}}
.cast{max-width:620px;margin:20px auto 0;background:#0f0f0e;color:#d8d2c6;padding:22px;font-family:"Noto Serif JP",serif;font-size:14.5px;line-height:2.1;border-radius:6px}
.cast p{opacity:.15;filter:blur(3px);transition:opacity 1s,filter 1s}.cast p.on,.cast #talk p{opacity:1;filter:none}.cast .nz{color:#6b6559;letter-spacing:.3em}
.cast .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cast input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 10px;background:#1b1a17;border:1px solid #47423a;color:#efe8db}
.cast button{font:inherit;font-size:14px;background:#2b2722;color:#efe8db;border:1px solid #5a5247;padding:9px 14px;cursor:pointer}
.card-post{margin-top:18px;background:#efe6d2;color:#2a2018;padding:16px 18px;border-radius:2px;font-family:"Noto Serif JP",serif}
.card-post input{width:100%;margin-top:8px;background:transparent;border:none;border-bottom:1px solid #8a7a60;color:#2a2018;font:inherit;font-size:18px;padding:6px 2px}
.msg{min-height:22px;font-size:13px;margin-top:8px;color:#d9a07a}
.cast .wide .cut{color:#7a7468}
@media (orientation:portrait){.cast .wide .rest{display:none}}
@media (orientation:landscape){.cast .wide .cut{display:none}}
.stamp{flex-shrink:0;width:64px;height:64px;border-radius:50%;border:2px dashed #a0503a;color:#a0503a;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.stamp i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(160,80,58,.25)}
.stamp.done{border-style:solid;background:rgba(160,80,58,.15)}
.stamp span{position:relative}
.radio.noisy .disp b,.radio.noisy .disp small{animation:nzb .15s steps(2) infinite;filter:blur(1.2px)}
@keyframes nzb{50%{opacity:.4;transform:translateX(1px)}}
body.night{--main:#7fb8c0;--main2:#7fb8c0;--sky:#0e171a;--ink:#d3dadb;--muted:#7c8a8d;--line:#1f2d31;--bg:#091114;--card:#0f1a1d;--foot:#050a0c}
body.night .ph img{filter:brightness(.5) saturate(.6)}
body.night .pagehead{background:#0f1f24}
body.night .gh{background:#0b1518}
#end{position:fixed;inset:0;background:#000;color:#ded8cc;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:"Noto Serif JP",serif;text-align:center;overflow-y:auto}
#end p{opacity:0;transition:opacity 1.6s;margin:7px 0;font-size:15.5px;letter-spacing:.12em}
#end p.v{opacity:1}
#end button{margin:22px 4px 0;background:none;border:1px solid #4a4a44;color:#bbb;padding:8px 18px;font:inherit;opacity:0;transition:opacity 2s;cursor:pointer}
</style>

const KEY="fm-minase-v1";
let S={stage:0,rn:"",msg:"",ends:[],last:0};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function setStage(n){if(n>S.stage){S.stage=n;save()}}
const after=n=>S.stage===9&&S.last===n;
const END_T={1:"混線",2:"停波",3:"おかえり"};

const norm=s=>hira((s||"").trim().replace(/[\s　、。,.・「」]/g,""));
const esc=s=>(s||"").replace(/[<>&"']/g,"");

}

  <h3 class="sub">みなせ岬灯台</h3><table class="dtable"><tr><th>初点灯</th><td>明治三十二年</td></tr><tr><th>灯質</th><td>白色の閃光。<b>4秒に1回</b>光ります。</td></tr><tr><th>中継局</th><td>1998年〜2004年。灯台の上にアンテナと小さなスタジオがありました。現在は撤去されています。<br><span style="color:var(--muted);font-size:13px">停波後も「電波の届かない場所でだけ、深夜番組が聞こえた」という話が、ときどき寄せられます。</span></td></tr></table></div></section>`;
}
function vMail(){
  return head("MAIL","お便り・リクエスト")+`<section style="padding-top:20px"><div class="inner" style="max-width:640px">
  <p class="lead">開局30周年企画「あなたの思い出のラジオ番組」。FMみなせの番組で、心に残っているものを教えてください。番組内でご紹介させていただく場合があります。</p>
  ${S.rn?`<div style="border:1px solid var(--line);padding:18px;background:var(--sky)"><b>お便りを受け付けました。</b><p style="font-size:14px;margin-top:8px">ラジオネーム：${esc(S.rn)}<br>「${esc(S.msg)}」</p>${S.stage>=4?`<p class="note" style="margin-top:8px">放送日：2004年11月14日　ミッドナイト・ポスト</p>`:""}</div>`
  :`<form class="form" id="mf"><div><label>ラジオネーム</label><input id="mrn" maxlength="16" placeholder="例）みなとの猫" required autocomplete="off"></div><div><label>思い出の番組と、メッセージ</label><textarea id="mmsg" rows="4" maxlength="80" placeholder="80文字まで" required></textarea></div><button class="btn fill" style="justify-self:start">送信する</button><p class="note">※ 個人情報の入力は不要です。お名前はラジオネームでお願いします。</p></form>`}
  </div></section>`;
}
function vFaq(){
  let f=[["ウェブラジオで他局は聴けますか？","FMみなせ専用のプレーヤーですので、78.6MHzのみとなります。","プレーヤーのアドレスの末尾（#fm786）をご覧ください。"],
   ["深夜番組の情報が見つかりません","深夜のサイトにだけ、載っております。","お使いの端末を「ダークモード」にしてご覧ください（0時〜5時は、そのままで）。"],
   ["聴き逃し配信の文字起こしが欠けています","欠けた文字は、前後から補えます。","「はちじゅうきゅう、てん」。残りは、灯台が一度まばたきする間＝光る間隔。受信エリアのページをご覧ください。"]];
  if(S.stage>=2) f.push(["雑音がひどくて何も読めません","古いラジオは、叩けば直る。と、潮田ゲンが申しております。","ラジオの本体を、すばやく何度もタップしてください。"]);
  if(S.stage>=3) f.push(["「混信しています」と表示されます","灯台中継局の電波は、ほかの電波が届かない場所でだけ、聞こえたそうです。","端末を「機内モード」にしてください（パソコンの方はネットワークを切断）。受信が終わったら、解除して構いません。"]);
  if(S.stage>=4) f.push(["お便りの一行が、最後まで表示されません","表示窓が、少しせまいようです。","スマートフォンを横向きにしてください。"],
    ["ナギさんの本当の名前は？","お便りの中と、パーソナリティのページに。","下の名前は、迷子のカナリアちゃんのお便りに。苗字は、みさきさんのプロフィールに。……カナリアちゃんは、誰だったのでしょう。"],
    ["ハガキの出し方は？","消印を押せば、投函されます。","消印の丸を、しばらく長押ししてください。"]);
  if(S.ends.length) f.push(["結末はひとつですか？","三つあります。"]);
  return head("FAQ","よくある質問")+`<section style="padding-top:10px"><div class="inner" style="max-width:820px">${f.map(x=>`<div class="q">${x[0]}</div><div class="a">${x[1]}${x[2]?`<details class="h2"><summary>さらにヒントを見る</summary>${x[2]}</details>`:""}</div>`).join("")}</div></section>`;
}
function vCredits(){
  const e=Object.entries(CREDITS);
  return head("PHOTO CREDITS","写真クレジット")+`<section style="padding-top:20px"><div class="inner"><ul class="news">${e.map(([k,c])=>`<li style="grid-template-columns:1fr"><span style="font-size:13px">${c.artist}／${c.license}<br><a style="color:var(--main2);word-break:break-all" href="${c.page}">${c.file}</a></span></li>`).join("")}</ul><p class="note" style="margin-top:10px">掲載写真は Wikimedia Commons の自由ライセンス画像です。本サイトは架空のラジオ局を舞台にした謎解きゲームであり、実在の団体とは関係ありません。</p></div></section>`;
}
function notFound(){return head("404","ページが見つかりません")+`<section style="padding-top:20px"><div class="inner"><p>お探しのページは見つかりませんでした。</p><a class="btn" href="#top">トップへ</a></div></section>`}

/* ===== 聴き逃し配信（自動文字起こし） ===== */
const EP1=[
 "おはようございます。おはようみなせ、パーソナリティのみさきです。",
 "今日のみなせは、晴れのち、くもり。海は、おだやかです。",
 "さて、開局30周年の企画「思い出のラジオ番組」。たくさんのお便りを、ありがとうございます。",
 "なかでも多かったのが、むかしの深夜番組「ミッドナイト・ポスト」。わたしも子どものころ、聴いていた気がします。",
 "<span class='nzl'>（ノイズ）……は■じゅ■……き■う……て■……。……の■りは……■うだいが……いちど、ま■たきする、あい■……</span>",
 "あれ、いま何か混線しましたね。失礼しました。それでは、一曲目。",
];
/* ===== ウェブラジオ：周波数はURLで決まる（#fm786 = 78.6MHz） ===== */
let R={taps:[],cast:0};
function fqFromHash(h){const m=h.match(/^fm(\d{3})$/);return m?+m[1]/10:null}
function radioHTML(fq){
  const ghost=Math.abs(fq-GHOST)<.05, home=Math.abs(fq-HOME)<.05;
  let st= home?"FMみなせ　おはようみなせ（放送中）": ghost?(S.stage>=3?"……受信待機":"ザ……ザザ……（ひどい雑音）"):"この周波数では、何も受信できません";
  let scale="";for(let f=76;f<=95;f+=.5){const x=(f-76)/19*100;scale+=`<i class="tk" style="left:${x}%;height:${f%1===0?14:7}px"></i>${f%2===0?`<span class="lb" style="left:${x}%">${f}</span>`:""}`}
  return `<div class="radio${ghost&&S.stage<3?" noisy":""}" id="radio">
   <div class="disp"><b>${fq.toFixed(1)}</b><small>MHz</small><div class="st" id="rst">${st}</div></div>
   <div class="scale">${scale}<i class="needle" style="left:${(fq-76)/19*100}%"></i></div>
   <p class="hint" id="rhint">${home?"FMみなせ専用プレーヤー（78.6MHz）。ほかの周波数には合わせられません。":ghost&&S.stage<3?"雑音がひどい。ずいぶん古いラジオのようだ。":""}</p>
   ${ghost&&S.stage>=3&&S.stage<9?`<div class="row"><button id="off">電源を切る</button></div>`:""}
  </div>`;
}
function vListen(){
  const h=(location.hash||"").slice(1), fq=fqFromHash(h)??HOME;
  if(Math.abs(fq-GHOST)<.05&&S.stage<9) setStage(2);
  const ghost=Math.abs(fq-GHOST)<.05;
  return head("LISTEN","ラジオを聴く・聴き逃し配信")+`<section style="padding-top:20px"><div class="inner">
  ${radioHTML(fq)}
  <div id="cast"></div>
  ${ghost?"":`<h3 class="sub">聴き逃し配信</h3>
  <div class="ep" id="ep1"><h4>おはようみなせ</h4><div class="d">前日放送分（冒頭3分）・自動文字起こし</div>
   <div class="row" style="margin-top:8px;display:flex;gap:8px"><button class="btn" id="tr1">文字起こしを読む</button></div>
   <div class="tr">${EP1.map(l=>`<p>${l}</p>`).join("")}</div></div>
  <div class="ep"><h4>夕なぎジャーナル</h4><div class="d">配信準備中</div></div>
  ${isNight()?`<div class="ep" style="border-color:#4a5a70"><h4>ミッドナイト・ポスト　最終回</h4><div class="d">2004年11月14日 25:00〜　灯台中継局より放送</div><p style="font-size:13.5px;margin-top:8px">この回は、灯台中継局の周波数でのみ放送されました。中継局は停波しているため、配信はありません。</p></div>`:""}
  <p class="note">※ 聴き逃し配信は、自動文字起こしでお届けしています。電波の状態により、一部が欠けることがあります。</p>`}
  </div></section>`;
}
function bindListen(){
  const ep=document.getElementById("ep1");
  if(ep) document.getElementById("tr1").onclick=()=>{ep.classList.toggle("open");if(S.stage<1){S.stage=1;save()}};
  const r=document.getElementById("radio");if(!r)return;
  const fq=fqFromHash((location.hash||"").slice(1))??HOME;
  const ghost=Math.abs(fq-GHOST)<.05;
  // 叩く：短い間隔で何度もタップ
  r.addEventListener("click",e=>{
    if(e.target.id==="off")return;
    r.classList.remove("shakeit");void r.offsetWidth;r.classList.add("shakeit");
    if(!ghost||S.stage!==2)return;
    const t=Date.now();R.taps=R.taps.filter(x=>t-x<3000);R.taps.push(t);
    if(R.taps.length>=6){R.taps=[];setStage(3);route()}
  });
  const off=document.getElementById("off");
  if(off) off.onclick=()=>{if(document.getElementById("castbox"))ending(2);else route()};
  if(ghost&&S.stage>=3&&S.stage<9) showCast();
}

/* ===== 消えた放送：電波の届かない端末にだけ流れる ===== */
function castLines(){
  return ["こんばんは。ミッドナイト・ポスト、夜野ナギです。","2004年11月14日。今夜も、みなせ岬の灯台の上から、お届けしています。","さっそく、最初のお便り。ラジオネーム「迷子のカナリア」ちゃん。",
   "『ナギさん、こんばんは。わたしは10さいです。いま、灯台の下にいます。くらくて、帰り道がわかりません。』",
   `<span class="wide">『わたしのママも、ラジオのお仕事をしています。ママの名前は、<span class="rest">とうこ。灯台の灯に、子どもの子、です。』</span><span class="cut">……（表示しきれません）</span></span>`,
   "『ママに、むかえにきてほしい。』","……カナリアちゃん。……今、行くからね。そこで、待ってて。",
   `……次のお便り。ラジオネーム「${esc(rn())}」さん。`,`『${esc(S.msg)||"（白紙のハガキ）"}』`,"……あれ。このお便り、消印が……ずいぶん、先の日付ですね。",
   `……ねえ、${esc(rn())}さん。このお便りは、どうやって届いたのかな。`,"この番組、ずっと、終われないんです。だれかが、わたしの、ほんとうの名前を書いて、送ってくれたら……"];
}
function showCast(){
  const c=document.getElementById("cast");if(!c)return;
  const L=castLines();
  c.innerHTML=`<div class="cast" id="castbox"><p class="nz on" id="castst"></p>${L.map((l,i)=>`<p data-c="${i}">${l}</p>`).join("")}<div id="talk"></div></div>`;
  const ps=[...c.querySelectorAll("[data-c]")];
  const done=()=>{ps.forEach(p=>p.classList.add("on"));document.getElementById("castst").textContent="――文字放送（灯台中継局）";setStage(4);document.getElementById("talk").innerHTML=talkUI();bindTalk()};
  if(S.stage>=4){done();return}
  let k=0;clearInterval(R.cast);
  const st=document.getElementById("castst"),rs=document.getElementById("rst");
  R.cast=setInterval(()=>{
    if(!document.body.contains(c)){clearInterval(R.cast);return}
    if(navigator.onLine){st.textContent="――混信しています。ほかの電波が、強すぎる。";if(rs)rs.textContent="混信";return}
    st.textContent="――ザ……（文字放送を受信しています）";if(rs)rs.textContent="……受信中";
    if(k<ps.length){ps[k].classList.add("on");k++}else{clearInterval(R.cast);done()}
  },2000);
}
function talkUI(){
  return `<div class="card-post"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><p style="font-size:13px;color:#6b5a40">ナギさんへ</p>
  <p style="font-size:13px;color:#6b5a40;margin-top:6px">あなたの、ほんとうの名前は――</p></div>
  <div class="stamp" id="stamp"><span>消印</span><i id="stampbar"></i></div></div>
  <input id="tname" placeholder="ひらがな、または漢字で" autocomplete="off">
  <p style="text-align:right;font-size:11.5px;color:#8a7a60;margin-top:6px">宛先：89.4MHz　ミッドナイト・ポスト係</p></div>
  <p style="font-size:12.5px;color:#a39c90;margin-top:8px">消印を押せば、投函される。</p><div class="msg" id="tmsg"></div>`;
}
function checkName(raw){
  const v=norm(raw);const m=document.getElementById("tmsg");
  const sur=/(みさき|岬)/.test(v), giv=/(とうこ|灯子)/.test(v);
  if(sur&&giv){ending(3);return}
  if(!v){m.textContent="宛名のないハガキは、届かない。";return}
  if(/(なぎ|凪)/.test(v)){m.textContent="……ザ……（「それは、番組の名前」と、かすかに表示された）";return}
  if(giv&&!sur){m.textContent="……ザ……（「……それと？」と、かすかに表示された）";return}
  ending(1);
}
function bindTalk(){
  const s=document.getElementById("stamp");if(!s)return;
  let t0=0,on=false,raf=0;
  const go=()=>{if(!on)return;const p=Math.min(1,(Date.now()-t0)/1500);document.getElementById("stampbar").style.height=p*100+"%";if(p>=1){on=false;s.classList.add("done");setTimeout(()=>checkName(document.getElementById("tname").value),400);setTimeout(()=>{s.classList.remove("done");document.getElementById("stampbar").style.height=0},1600);return}raf=requestAnimationFrame(go)};
  s.addEventListener("pointerdown",e=>{e.preventDefault();on=true;t0=Date.now();go()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>s.addEventListener(ev,()=>{if(on){on=false;cancelAnimationFrame(raf);document.getElementById("stampbar").style.height=0}}));
  s.addEventListener("contextmenu",e=>e.preventDefault());
}
window.addEventListener("online",()=>{});window.addEventListener("offline",()=>{});

/* ===== ルーティング ===== */
const VIEWS={top:vTop,timetable:vTimetable,personality:vPersonality,listen:vListen,mail:vMail,history:vHistory,area:vArea,faq:vFaq,news:vNews,credits:vCredits};
let lastHash="";
function route(){
  const h=(location.hash||"#top").slice(1);
  clearInterval(R.cast);
  document.body.classList.toggle("night",isNight());
  document.getElementById("ticker").textContent= after(3)?"今夜25時、ミッドナイト・ポスト最終回を放送します": after(1)?`今夜も25時から、ミッドナイト・ポスト（パーソナリティ：${rn()}）`:isNight()?"放送休止中（24:00〜6:00）":"ON AIR　おはようみなせ（6:00〜9:00）";
  document.getElementById("gnav").innerHTML=PAGES.map(([k,v])=>`<a href="#${k}" class="${k===h?"on":""}">${v}</a>`).join("");
  document.getElementById("drawer").innerHTML=[...PAGES,...EXTRA].map(([k,v])=>`<a href="#${k}">${v}</a>`).join("");
  document.getElementById("drawer").classList.remove("open");
  const view=VIEWS[h]||(fqFromHash(h)!==null?vListen:null);
  document.getElementById("main").innerHTML=(view||notFound)();
  if(lastHash!==h)window.scrollTo(0,0);lastHash=h;bind(h);
}
window.addEventListener("hashchange",route);
document.getElementById("hamb").onclick=()=>document.getElementById("drawer").classList.toggle("open");
const mq=matchMedia("(prefers-color-scheme: dark)");
function isNight(){return mq.matches||new Date().getHours()<5}
(mq.addEventListener?mq.addEventListener("change",route):mq.addListener(route));
function bind(h){
  const mf=document.getElementById("mf");
  if(mf) mf.onsubmit=e=>{e.preventDefault();S.rn=document.getElementById("mrn").value.trim().slice(0,16);S.msg=document.getElementById("mmsg").value.trim().slice(0,80);save();route()};
  if(h==="listen"||fqFromHash(h)!==null) bindListen();
}

/* ===== 結末 ===== */
function endLines(id){
  const n=esc(rn());
  return {
   1:["ハガキは、雑音の中に消えた。","しばらくして、表示に一行だけ。","「……ちがう。それは、わたしの名前じゃない」","「でも、来てくれて、ありがとう」","「かわりに――あなたが、続けてくれる？」",`今夜も25時。灯台の上のスタジオで、あなたはお便りを読んでいる。`,`「ミッドナイト・ポスト。パーソナリティの、${n}です」`],
   2:["電源を切ると、雑音が消えた。","部屋は、しんと静かになった。","……それでも、ときどき思う。","あの声は、今もどこかで、","誰にも届かないお便りを、読み続けているのだろうか、と。"],
   3:["ハガキが、電波に乗った。","表示から、雑音がすうっと引いていく。","「……ああ。久しぶりに、その名前を見た」","「カナリアちゃんはね、あのあと、ちゃんと見つかったんだよ」","「わたしが手を引いて、灯台の階段を、いっしょに降りたの」","「もう、大人になったかな。……ラジオの声、続けてるかな」","「ミッドナイト・ポスト、これにて、最終回です」","「おやすみなさい。……みさき」"]
  }[id];
}
function ending(id){
  clearInterval(R.cast);
  if(!S.ends.includes(id))S.ends.push(id);S.stage=9;S.last=id;save();
  const lines=[...endLines(id),`<span class="en" style="font-size:13px;color:#9fd3d9">${id===3?"TRUE END":"END "+id}　―　${END_T[id]}</span>`,`<small style="font-size:12px;color:#7a8a8c">結末 ${S.ends.length} / 3</small>`];
  const d=document.createElement("div");d.id="end";
  if(id===3)d.style.background="linear-gradient(#060d14,#16303a 60%,#4a6a70)";
  d.innerHTML=lines.map(l=>`<p>${l}</p>`).join("")+`<div><button id="eb1">トップへ戻る</button><button id="eb2">もう一度、89.4MHzへ</button></div>`;
  document.body.appendChild(d);
  const ps=d.querySelectorAll("p");ps.forEach((p,i)=>setTimeout(()=>p.classList.add("v"),700+i*1500));
  setTimeout(()=>d.querySelectorAll("button").forEach(b=>b.style.opacity=1),700+ps.length*1500);
  d.querySelector("#eb1").onclick=()=>{d.remove();location.hash="#top";route()};
  d.querySelector("#eb2").onclick=()=>{d.remove();S.stage=4;S.last=0;save();if(location.hash==="#fm894")route();else location.hash="#fm894"};
}
document.getElementById("reset").onclick=function(){
  if(this.dataset.c){try{localStorage.removeItem(KEY)}catch(e){}S={stage:0,rn:"",msg:"",ends:[],last:0};this.dataset.c="";this.textContent="データを初期化";location.hash="#top";route()}
  else{this.dataset.c=1;this.textContent="本当に初期化する？（もう一度押す）"}
};
route();
</script>
